# Off camera: into a new chat with Q_MONSOON pasted in the composer; the keyboard stays up, as when a person taps Send.
appId: ${APP_ID || "team.sopa.aoair.offline"}
---
- launchApp
- runFlow: ../perf/to-chat.yaml
- runFlow: ../prints/new-chat.yaml
- tapOn: ${T_ASK}
- setClipboard: ${Q_MONSOON}
- pasteText
- waitForAnimationToEnd
